worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8095;
        server_name localhost;

        # ✅ React build output (Vite dist folder)
        root   "C:\CEBfiles\Day 28 task 3-09-2025\pensioners\dist";
        index  index.html;

        # ✅ React Router (SPA fallback)
        location / {
            try_files $uri /index.html;
        }

        # ✅ Pension Login API proxy (keeps /CBRSAPI in path)
        location /api/ {
            proxy_pass http://10.128.1.126/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ✅ OTP API proxy
        location /otpapi/ {
            proxy_pass http://10.128.1.227:8080/SharedService/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
